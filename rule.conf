# ---------- Janelas ----------

# HDMI-A-1
window_rule=tags:1,monitor:HDMI-A-1,app_id:discord
window_rule=tags:2,monitor:HDMI-A-1,app_id:spotifast
# DP-1
window_rule=tags:1,monitor:DP-1,app_id:helium

# ---------- Layers ----------
layer_rule=animation_type_open:zoom,animation_type_close:zoom,layer_name:rofi
layer_rule=animation_type_open:zoom,animation_type_close:zoom,layer_name:fuzzel

# sem blur/animação na seleção do slurp (print)
layer_rule=no_animation:1,no_blur:1,layer_name:selection

# Keep Victoria Settings floating.
window_rule=is_floating:1,width:0.65,height:0.80,app_id:^io[.]victoria[.]Settings$

window_rule=is_floating:1,app_id:^io[.]victoria[.]Mixer.*$

layer_rule=animation_type_open:slide,animation_type_close:fade,layer_name:victoria-mixer

window_rule=is_floating:1,app_id:^io[.]victoria[.]Wifi$

window_rule=is_floating:1,no_animation:1,app_id:^io[.]victoria[.]Clipboard$

layer_rule=animation_type_open:slide,animation_type_close:fade,layer_name:victoria-player

window_rule=is_floating:1,app_id:^io[.]victoria[.]MediaPlayer$
