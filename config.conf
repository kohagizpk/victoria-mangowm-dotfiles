# ~/.config/mango/config.conf — arquivo principal do mangowm
# Sintaxe conferida com a doc do mango 0.16 (https://mangowm.github.io/docs)
# Para validar sem abrir a sessão:  mango -c ~/.config/mango/config.conf -p
#
# Cada área vive em um arquivo próprio (ver "Sub-configs" no fim deste arquivo):
# env.conf, bind.conf, rule.conf, monitor.conf, tag.conf e colors.conf
# (este último é gerado pelo wallust).

# ---------- Efeitos ----------
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes = 3
blur_params_radius = 6
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.3

shadows = 1
layer_shadows = 1
shadow_only_floating = 1
shadows_size = 18
shadows_blur = 22
shadows_position_x = 0
shadows_position_y = 4
shadows_color = 0x11111b90

border_radius=12
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.96

# ---------- Animações ----------
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.3
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=350
animation_duration_open=280
animation_duration_tag=250
animation_duration_close=350
animation_duration_focus=100
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.08,0.92,0,1
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# ---------- Scroller ----------
# Obs. (doc 0.16): a prioridade é scroller_prefer_overspread > scroller_focus_center
# > scroller_prefer_center. Como scroller_prefer_overspread vale 1 por padrão, os
# dois "center" abaixo só fazem efeito se você também colocar
# scroller_prefer_overspread=0. As tags usam o layout "tile" (ver tag.conf), então
# isso só importa quando você troca uma tag para scroller.
scroller_structs=20
scroller_default_proportion=1.0
scroller_focus_center=1
scroller_prefer_center=1
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# ---------- Master-Stack ----------
new_is_master=1
default_master_factor=0.55
default_master_count=1
smart_gaps=0

# ---------- Overview ----------
hotarea_size=10
enable_hotarea=0
overview_gap_inner=5
overview_gap_outer=30

# ---------- Misc ----------
xwayland_persistence=1
sync_obj_enable=1
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=36
cursor_theme=Samuel-Noticias-Cursor
drag_tile_to_tile=1

# ---------- Teclado ----------
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us
xkb_rules_variant=intl

# ---------- Trackpad / mouse ----------
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1
mouse_natural_scrolling=0

# ---------- Aparência ----------
gap_inner_horizontal=8
gap_inner_vertical=8
gap_outer_horizontal=10
gap_outer_vertical=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=2

# ---------- Sub-configs ----------
# O mango recarrega sozinho (auto_reload_config=1, padrão) quando qualquer um
# destes arquivos muda — inclusive o colors.conf quando o wallust o regenera.
source=./env.conf
source=./bind.conf
source=./rule.conf
source=./monitor.conf
source=./tag.conf
# colors.conf por último, para sobrescrever as cores padrão
source=./colors.conf

# ---------- Autostart ----------
exec_once=bash ~/.config/mango/autostart.sh
