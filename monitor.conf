# Monitores. ATENÇÃO: este arquivo é ajustado para a máquina da autora
# (DP-1 a 165 Hz à esquerda, HDMI-A-1 à direita). Em outro PC, descubra os nomes
# com `wlr-randr` e edite as linhas abaixo. "name" é regex, por isso ^...$.
# Em XWayland nunca use coordenadas negativas (bug conhecido).
monitor_rule=name:^DP-1$,width:1920,height:1080,refresh:165.001999,x:0,y:0
monitor_rule=name:^HDMI-A-1$,width:1920,height:1080,refresh:60,x:1920,y:0
