# ~/.config/wallust/templates/mango-colors.conf
# Template pywal do wallust. Gera ~/.config/mango/colors.conf a cada wallpaper
# novo (nomes de chave da doc do mango 0.16). Edite ESTE arquivo, nunca o gerado.
#
# Se algum slot sair com uma cor que não combina com o resto,
# é só trocar o número (color0-color15, background, foreground).

root_color=0x0B0A0Aff
border_color=0x222121ff
focus_color=0x960B06ff
maximized_screen_color=0x750907ff
urgent_color=0x280908ff
scratchpad_color=0x4E4C4Cff
global_color=0x3E0707ff
overlay_color=0x960B06ff
drop_color=0x960B0600
