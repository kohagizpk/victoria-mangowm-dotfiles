# ~/.config/wallust/templates/mango-colors.conf
# Template pywal do wallust. Gera ~/.config/mango/colors.conf
# a cada wallpaper novo. Edite ESTE arquivo, nunca o gerado.
#
# Se algum slot sair com uma cor que não combina com o resto,
# é só trocar o número (color0-color15, background, foreground).

rootcolor=0x{{ background | strip }}ff
bordercolor=0x{{ color8 | strip }}ff
focuscolor=0x{{ color5 | strip }}ff
maximizescreencolor=0x{{ color4 | strip }}ff
urgentcolor=0x{{ color1 | strip }}ff
scratchpadcolor=0x{{ color6 | strip }}ff
globalcolor=0x{{ color2 | strip }}ff
overlaycolor=0x{{ color13 | strip }}ff
dropcolor=0x{{ color5 | strip }}00

