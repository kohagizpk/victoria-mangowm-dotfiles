# Instalar em ~/.config/wallust/wallust.toml
# (o template do mango vai em ~/.config/wallust/templates/mango-colors.conf;
#  o install.sh copia os dois automaticamente)

palette = "kmeans"

[templates]
waybar = { template = '../../mango/waybar/waybar-colors.css', target = '~/.config/mango/waybar/colors.css' }
mango = { template = 'mango-colors.conf', target = '~/.config/mango/colors.conf' }

[hooks]
# O mango já recarrega sozinho quando o colors.conf muda (auto_reload_config=1);
# este hook só garante o reload caso isso esteja desligado.
mango_reload = "mmsg dispatch reload_config"
