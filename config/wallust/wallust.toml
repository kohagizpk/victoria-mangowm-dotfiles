# Wallust 3.x: kmeans extracts colors; dark is the palette layout.
backend = "kmeans"
palette = "dark"
check_contrast = true

[templates]
waybar = { template = 'waybar-colors.css', target = '~/.config/mango/waybar/colors.css' }
mango = { template = 'mango-colors.conf', target = '~/.config/mango/colors.conf' }
terminal = { template = 'terminal-colors.json', target = '~/.cache/wallust/victoria-palette.json' }
# Session refresh and terminal sequences are handled by scripts/theme.py.
rofi = { template = 'rofi-colors.rasi', target = '~/.config/mango/config/rofi/colors.rasi' }
fuzzel = { template = 'fuzzel.ini', target = '~/.config/mango/config/fuzzel.ini' }
wlogout = { template = 'waybar-colors.css', target = '~/.config/wlogout/colors.css' }
