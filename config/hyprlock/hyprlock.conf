# Victoria lock screen. Palette and wallpaper are resolved at lock time.
general {
    immediate_render = true
    disable_screencopy = true
}
background {
    monitor =
    path = @WALLPAPER@
    color = rgb(@BACKGROUND@)
    blur_passes = 3
    blur_size = 7
    brightness = 0.65
}
label {
    monitor =
    text = $TIME
    color = rgb(@FOREGROUND@)
    font_size = 76
    font_family = JetBrainsMono Nerd Font
    position = 0, 170
    halign = center
    valign = center
}
label {
    monitor =
    text = Welcome back, $USER
    color = rgb(@FOREGROUND@)
    font_size = 20
    position = 0, 65
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 360, 62
    outline_thickness = 2
    rounding = 16
    outer_color = rgb(@ACCENT@)
    inner_color = rgba(@BACKGROUND@ee)
    font_color = rgb(@FOREGROUND@)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    placeholder_text = Enter your password
    check_text = Checking password…
    fail_text = Incorrect password — try again
    fail_color = rgb(e78284)
    capslock_color = rgb(e5c890)
    dots_size = 0.25
    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}
label {
    monitor =
    text = Type your login password, then press Enter
    color = rgba(@FOREGROUND@bb)
    font_size = 12
    position = 0, -85
    halign = center
    valign = center
}
