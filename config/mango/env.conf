# Variáveis de ambiente do mango. Atenção (doc 0.16): elas são redefinidas a cada
# reload da config. XCURSOR_* e XDG_* também são exportadas no autostart.sh para
# os processos que ele inicia.
env=XCURSOR_THEME,Samuel-Noticias-Cursor
env=XCURSOR_SIZE,24
env=XDG_CURRENT_DESKTOP,wlroots
env=XDG_SESSION_TYPE,wayland

env=GTK_THEME,Materia-dark-compact
env=QT_STYLE_OVERRIDE,kvantum
