# ---------- Janelas ----------
window_rule=is_floating:1,app_id:waypaper

# Keep tag choices portable; no fixed output names.
window_rule=tags:1,app_id:discord
window_rule=tags:2,app_id:spotify
window_rule=tags:1,app_id:helium

# ---------- Layers ----------
layer_rule=animation_type_open:zoom,animation_type_close:zoom,layer_name:rofi
layer_rule=animation_type_open:zoom,animation_type_close:zoom,layer_name:fuzzel

# sem blur/animação na seleção do slurp (print)
layer_rule=no_animation:1,no_blur:1,layer_name:selection
