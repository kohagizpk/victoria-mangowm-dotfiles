name: Shell regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Isolated installer and launcher tests
        run: python3 -m unittest discover -s tests -v
      - name: Check whitespace
        run: git diff --check
